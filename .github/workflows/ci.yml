name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Enable Corepack and verify pnpm
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd install -g corepack@0.36.0 --force
          $npmPrefix = (npm.cmd prefix --global).Trim()
          $env:Path = "$npmPrefix;$env:Path"
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          corepack.cmd enable
          $pnpmVersion = (pnpm.cmd --version).Trim()
          Write-Output "pnpm $pnpmVersion"
          if ($pnpmVersion -cne '12.18.0') {
            throw "Expected pnpm 12.18.0, got $pnpmVersion."
          }

      - run: pnpm.cmd install --frozen-lockfile

      - run: pnpm.cmd check
      - run: pnpm.cmd coverage
      - run: pnpm.cmd format:check
      - run: pnpm.cmd exec playwright install chromium

      - name: Playwright e2e
        id: e2e
        run: pnpm.cmd e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --locked --features desktop -- -D warnings
        working-directory: apps/desktop/src-tauri

  installer:
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches the Tauri version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content -Raw -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Tauri version v$version."
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Enable Corepack and verify pnpm
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd install -g corepack@0.36.0 --force
          $npmPrefix = (npm.cmd prefix --global).Trim()
          $env:Path = "$npmPrefix;$env:Path"
          $npmPrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          corepack.cmd enable
          $pnpmVersion = (pnpm.cmd --version).Trim()
          Write-Output "pnpm $pnpmVersion"
          if ($pnpmVersion -cne '12.18.0') {
            throw "Expected pnpm 12.18.0, got $pnpmVersion."
          }

      - run: pnpm.cmd install --frozen-lockfile

      - run: pnpm.cmd tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcbk-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    needs: installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # GitHub Actions permissions apply to jobs, so publication is isolated here.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pcbk-msi
          path: release-assets

      - name: Publish release with MSI
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath release-assets -Filter '*.msi' -File | ForEach-Object { $_.FullName })
          if ($installers.Count -eq 0) {
            throw 'The installer artifact contains no MSI files.'
          }
          gh release create "$env:GITHUB_REF_NAME" @installers --verify-tag --generate-notes
