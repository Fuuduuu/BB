[package]
name = "pcbk-desktop"
version = "0.0.0"
edition = "2021"

[lib]
name = "pcbk_desktop"
path = "src/lib.rs"

[features]
default = []
tauri-ipc = ["dep:tauri"]

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = "=0.4.45"
dunce = "=1.0.5"
uuid = { version = "=1.29.1", features = ["v4"] }
ts-rs = "=12.0.1"
tauri = { version = "=2.12.5", default-features = false, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
