[package]
name = "pcbk-desktop"
version = "0.0.0"
edition = "2021"
default-run = "pcbk-desktop"

[lib]
name = "pcbk_desktop"
path = "src/lib.rs"

[[bin]]
name = "pcbk-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
tauri-ipc = ["dep:tauri"]
desktop = [
    "tauri-ipc",
    "tauri/wry",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-single-instance",
]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = "=0.4.45"
dunce = "=1.0.5"
uuid = { version = "=1.29.1", features = ["v4"] }
ts-rs = "=12.0.1"
tauri = { version = "=2.12.5", default-features = false, optional = true , features = [] }
log = "=0.4.35"
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
tauri-plugin-log = { version = "=2.10.1", optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "=0.6.2"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
