commands.allow = [
  "project_create",
  "project_open",
  "project_save",
  "project_save_view",
  "project_copy",
  "project_backup_full",
  "project_backups",
  "project_restore",
  "photo_import_bytes",
  "photo_prune",
  "recent_list",
  "recent_add",
  "recent_remove",
  "project_close",
  "default_project_path",
  "take_initial_path",
  "log_export",
]
