<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>PCB Kaardistaja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: copper pad-and-trace stepper in the top bar · parts sidebar on the left · full-bleed board canvas · instrument strip under the photo */
  --bg:#e8ede9; --panel:#f6f8f6; --well:#e0e6e2; --line:#d0d9d3; --line-2:#b9c6bd;
  --ink:#16201c; --ink-2:#4a5852; --ink-3:#77847d;
  --accent:#b35c22; --accent-hi:#c66a2c; --accent-ink:#fff8f2; --accent-soft:#f1dfcf;
  --mask:#1e5a40; --canvas:#d3dbd5; --grid:rgba(30,60,45,.14);
  --top:#d9432b; --bottom:#2f6fd6; --wire:#c38410; --pad:#d0a630; --pad-edge:#6a510b; --pad-ink:#241a03; --drill:#1e221f;
  --body:#14201b; --halo:rgba(255,255,255,.85); --body-fill:rgba(255,255,255,.12);
  --dim:#a8329f; --sel:#0a97a3; --sel-fill:rgba(10,151,163,.12);
  --ok:#2c8150; --warn:#a86f00; --danger:#bf3a2b;
  --shadow:0 1px 2px rgba(16,28,22,.08),0 10px 30px rgba(16,28,22,.14);
  --f-ui:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-w:320px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --panel:#141c19; --well:#1b2521; --line:#25312c; --line-2:#34433c;
    --ink:#e3eae6; --ink-2:#a2b0a9; --ink-3:#6b7972;
    --accent:#e38a4c; --accent-hi:#f19b5e; --accent-ink:#1d0f05; --accent-soft:#3a2617;
    --mask:#2f8a62; --canvas:#0a0f0d; --grid:rgba(160,200,180,.07);
    --top:#ff6449; --bottom:#5f97ff; --wire:#f2b632; --pad:#e2bb4b; --pad-edge:#3a2c05; --pad-ink:#1f1602; --drill:#050706;
    --body:#eef3ef; --halo:rgba(0,0,0,.72); --body-fill:rgba(0,0,0,.16);
    --dim:#e273e2; --sel:#2fe0cf; --sel-fill:rgba(47,224,207,.12);
    --ok:#4cbf7f; --warn:#e3a72f; --danger:#ff6b5b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#141c19; --well:#1b2521; --line:#25312c; --line-2:#34433c;
  --ink:#e3eae6; --ink-2:#a2b0a9; --ink-3:#6b7972;
  --accent:#e38a4c; --accent-hi:#f19b5e; --accent-ink:#1d0f05; --accent-soft:#3a2617;
  --mask:#2f8a62; --canvas:#0a0f0d; --grid:rgba(160,200,180,.07);
  --top:#ff6449; --bottom:#5f97ff; --wire:#f2b632; --pad:#e2bb4b; --pad-edge:#3a2c05; --pad-ink:#1f1602; --drill:#050706;
  --body:#eef3ef; --halo:rgba(0,0,0,.72); --body-fill:rgba(0,0,0,.16);
  --dim:#e273e2; --sel:#2fe0cf; --sel-fill:rgba(47,224,207,.12);
  --ok:#4cbf7f; --warn:#e3a72f; --danger:#ff6b5b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:500 10.5px var(--f-mono);padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- app frame ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;min-width:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:28px;height:28px;flex:none}
.brand-name{font-weight:780;font-stretch:118%;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand-name span{color:var(--accent)}
.proj-name{width:150px;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;font-size:13px;color:var(--ink-2)}
.proj-name:hover{border-color:var(--line)}
.proj-name:focus{border-color:var(--line-2);background:var(--panel);color:var(--ink);outline:none}

.steps{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:2px 4px}
.steps>:first-child{margin-left:auto}
.steps>:last-child{margin-right:auto}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 6px;border-radius:8px;color:var(--ink-3);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:550}
.step:hover{color:var(--ink);background:var(--well)}
.spad{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--panel);font:600 10px var(--f-mono);color:var(--ink-3);flex:none}
.step.done .spad{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done .spad svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;fill:none}
.step.cur{color:var(--ink)}
.step.cur .spad{border-color:var(--accent);color:var(--accent);background:var(--panel);box-shadow:0 0 0 4px var(--accent-soft)}
.trace-seg{flex:0 1 26px;min-width:10px;height:2px;border-radius:2px;background:var(--line-2)}
.trace-seg.done{background:var(--accent)}

.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--well);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.only-narrow{display:none}

/* ---------- sidebar ---------- */
.side{grid-row:2;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 12px 0;padding-left:max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;padding:9px 4px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-3);font-weight:600;font-size:13px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font:500 10px var(--f-mono);background:var(--well);color:var(--ink-2);padding:2px 6px;border-radius:10px}
.tab-body{flex:1;min-height:0;overflow:auto;padding:14px 14px 28px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.side-close{display:none}

.search{position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--well);padding:0 10px 0 32px;font-size:13px}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.search svg{position:absolute;left:10px;top:8px;width:17px;height:17px;color:var(--ink-3)}
.hint-s{margin:0;font-size:12px;color:var(--ink-3);line-height:1.5}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sec-h .count{letter-spacing:0;text-transform:none}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:grab;font-size:11px;font-weight:550;color:var(--ink-2);text-align:center;line-height:1.2;min-width:0}
.tile span{overflow-wrap:anywhere}
.tile:hover{border-color:var(--accent);color:var(--ink)}
.tile.active{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tile:active{cursor:grabbing}
.thumb{width:100%;height:36px;overflow:visible}

.summary{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--well);border-radius:20px;padding:3px 9px;white-space:nowrap}
.chip b{font:600 11px var(--f-mono);color:var(--ink)}

.group{display:flex;flex-direction:column;gap:2px}
.row{border-radius:8px;border:1px solid transparent}
.row.open{border-color:var(--line-2);background:var(--panel);box-shadow:var(--shadow)}
.row-head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left;cursor:pointer}
.row-head:hover{background:var(--well)}
.row.open .row-head{background:transparent}
.ref{font:600 12px var(--f-mono);color:var(--ink);min-width:34px}
.meta{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta i{font-style:normal;color:var(--ink-3)}
.badges{display:flex;gap:4px;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.badge{padding:1px 6px;border-radius:9px;background:var(--well)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.empty{font-size:12.5px;color:var(--ink-3);padding:10px;border:1px dashed var(--line-2);border-radius:8px;line-height:1.5}

/* inspector */
.insp{display:flex;flex-direction:column;gap:12px;padding:4px 10px 12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;min-width:0}
.f input,.f select,.f textarea,.inp{width:100%;min-width:0;height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--well);padding:0 8px;font-size:13px;font-weight:450;color:var(--ink);letter-spacing:0}
.f textarea{height:auto;min-height:54px;padding:6px 8px;resize:vertical;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.f .mono,.inp.mono{font-size:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fp-name{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.fp-name b{font-weight:650;color:var(--ink)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--well);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .dotc{width:8px;height:8px;border-radius:50%}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;color:var(--ink-3)}
.pins-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pins-h h4{margin:0;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.pins{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;margin:0 -4px;padding:0 4px}
.pin{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}
.pin:hover{background:var(--well)}
.pin.on{background:var(--sel-fill);box-shadow:inset 0 0 0 1px var(--sel)}
.pid{font:600 11px var(--f-mono);color:var(--ink-2);text-align:center;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pin input{height:26px;font-size:12px}
.pin .conn{grid-column:2/-1;font:500 10.5px var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.net-chip{display:inline-flex;align-items:center;gap:5px;max-width:84px;font:600 10.5px var(--f-mono);padding:2px 7px 2px 5px;border-radius:10px;background:var(--well);color:var(--ink);cursor:pointer;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--nc,var(--ink-3));flex:none}
.net-chip.none{color:var(--ink-3);background:none;cursor:default}
.net-chip.none::before{background:none;border:1px solid var(--ink-3)}
.pact{display:flex;gap:2px}
.mini{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:5px;background:none;color:var(--ink-3);cursor:pointer}
.mini:hover{background:var(--panel);color:var(--accent)}
.mini svg{width:15px;height:15px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3)}
.kv b{font:600 12px var(--f-mono);color:var(--ink);text-align:right;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}

/* nets */
.net{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.net:hover,.net.on{border-color:var(--sel)}
.net.on{box-shadow:inset 0 0 0 1px var(--sel)}
.net-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.net-top .swatch{width:12px;height:12px;border-radius:50%}
.net-name{height:26px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 6px;font:600 12.5px var(--f-mono);min-width:0;width:100%}
.net-name:hover{border-color:var(--line)}
.net-name:focus{outline:none;border-color:var(--accent);background:var(--well)}
.nstat{font:500 10.5px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.members{display:flex;flex-wrap:wrap;gap:4px}
.mem{border:0;background:var(--well);border-radius:5px;padding:2px 6px;font:500 10.5px var(--f-mono);color:var(--ink-2);cursor:pointer}
.mem:hover{color:var(--ink);background:var(--accent-soft)}
.mem i{font-style:normal;color:var(--ink-3)}

/* ---------- stage ---------- */
.stage{grid-row:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.optbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;min-height:46px;padding:7px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px}
.ob-tool{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--ink);white-space:nowrap}
.ob-tool .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ob-tool .ico svg{width:16px;height:16px}
.ob-hint{color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;flex:1 1 280px;line-height:1.5}
.ob-hint span{white-space:nowrap}
.ob-field{display:flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}
.ob-field .inp{width:72px;height:28px;font:500 12px var(--f-mono)}

.canvas-wrap{position:relative;overflow:hidden;min-height:0;background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);background-size:18px 18px;touch-action:none}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.canvas-wrap.t-pan #svg,.canvas-wrap.panning #svg{cursor:grab}
.canvas-wrap.dragging #svg{cursor:grabbing}
.canvas-wrap.t-trace #svg,.canvas-wrap.t-measure #svg,.canvas-wrap.t-calib #svg,.canvas-wrap.t-point #svg,.canvas-wrap.t-pin #svg,.canvas-wrap.t-outline #svg,.canvas-wrap.t-place #svg{cursor:crosshair}

.rail{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:3}
.rail button{position:relative;width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.rail button:hover{background:var(--well);color:var(--ink)}
.rail button.on{background:var(--accent);color:var(--accent-ink)}
.rail button svg{width:19px;height:19px}
.rail .rsep{height:1px;background:var(--line);margin:3px 4px}
.rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--panel);font-size:12px;font-weight:550;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:9}

.banner{position:absolute;right:14px;top:14px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;z-index:3}
.banner h3{margin:0;font-size:14px;font-weight:700;font-stretch:108%;display:flex;align-items:center;gap:8px}
.banner p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.tag{font:600 10px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:10px}
.banner .x{position:absolute;right:6px;top:6px}

.dropzone{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:2;pointer-events:none}
.dz-card{pointer-events:auto;width:min(460px,100%);text-align:center;padding:34px 28px;border:2px dashed var(--line-2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px}
.dz-card svg.big{width:64px;height:64px}
.dz-card h2{margin:0;font-size:19px;font-weight:750;font-stretch:110%;text-wrap:balance}
.dz-card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.drag-over .dz-card,.dropzone.hot .dz-card{border-color:var(--accent);background:var(--accent-soft)}
.dropzone.overlay{background:color-mix(in srgb,var(--canvas) 70%,transparent)}

.tip{position:absolute;pointer-events:none;z-index:6;background:var(--ink);color:var(--panel);font:500 11.5px var(--f-mono);padding:6px 9px;border-radius:7px;line-height:1.5;max-width:280px;box-shadow:var(--shadow)}
.tip b{font-weight:700}
.tip i{font-style:normal;opacity:.7}

/* bottom instrument strip */

<script>

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const f2 = v => Math.round(v * 1000) / 1000;
const fmtN = (v, d = 2) => (Number.isFinite(v) ? v : 0).toFixed(d).replace('.', ',');

const DEG = Math.PI / 180;
function distToSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;

  return best;
}
const polyLen = pts => { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]); return L; };
const polyD = pts => 'M' + pts.map(p => f2(p[0]) + ' ' + f2(p[1])).join('L');
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

}

/* ---- dimension geometry ---- */

    s += `<line x1="${f2(a[0] + nx * gap * sg)}" y1="${f2(a[1] + ny * gap * sg)}" x2="${f2(A[0] + nx * over * sg)}" y2="${f2(A[1] + ny * over * sg)}"/>`;
    s += `<line x1="${f2(b[0] + nx * gap * sg)}" y1="${f2(b[1] + ny * gap * sg)}" x2="${f2(B[0] + nx * over * sg)}" y2="${f2(B[1] + ny * over * sg)}"/>`;
  }
  s += `<line x1="${f2(A[0])}" y1="${f2(A[1])}" x2="${f2(B[0])}" y2="${f2(B[1])}"/>`;
  const tri = (p, d) => `<polygon points="${f2(p[0])},${f2(p[1])} ${f2(p[0] + d * ux * ah + nx * aw)},${f2(p[1] + d * uy * ah + ny * aw)} ${f2(p[0] + d * ux * ah - nx * aw)},${f2(p[1] + d * uy * ah - ny * aw)}"/>`;

/* ---- photo rotate / mirror (keeps everything aligned) ---- */
async function transformImage(kind) {
  if (!img) { toast('Fotot pole veel laetud', 'warn'); return; }
  refreshEndpoints();
  const im = await loadImg(img.src), W = img.w, H = img.h, cv = document.createElement('canvas'), g = cv.getContext('2d');
  if (kind === 'rot') { cv.width = H; cv.height = W; g.translate(H, 0); g.rotate(Math.PI / 2); }
  else { cv.width = W; cv.height = H; g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(im, 0, 0);
  const src = cv.toDataURL(/^data:image\/png/.test(img.src) ? 'image/png' : 'image/jpeg', .92);
  const T = kind === 'rot' ? ([x, y]) => [f2(H - y), f2(x)] : ([x, y]) => [f2(W - x), f2(y)];
  for (const c of doc.comps) { [c.x, c.y] = T([c.x, c.y]); if (kind === 'rot') c.rot = (c.rot + 90) % 360; else { c.side = c.side === 'bottom' ? 'top' : 'bottom'; c.rot = (360 - c.rot) % 360; } }
  const te = ep => { [ep.x, ep.y] = T([ep.x, ep.y]); };
  for (const t of doc.traces) { te(t.a); te(t.b); t.pts = t.pts.map(T); }
  for (const d of doc.dims) { te(d.a); te(d.b); if (kind === 'flip') d.off = -d.off; }
  for (const o of doc.outlines) { if (kind === 'rot') { const nx = H - (o.y + o.h), ny = o.x; o.x = nx; o.y = ny; [o.w, o.h] = [o.h, o.w]; } else o.x = W - o.x - o.w; }
  if (doc.calib) { doc.calib.a = T(doc.calib.a); doc.calib.b = T(doc.calib.b); }
  img = { ...img, src, w: cv.width, h: cv.height };
  renderImage(); saveImage(); commit(); fitView();
  toast(kind === 'rot' ? 'Foto pööratud 90°' : 'Foto peegeldatud');
}

function buildSample() {

    const c = { id: 'tmp', type, ref, value, x: B(x, y)[0], y: B(x, y)[1], rot, side: 'top', params: { ...defaultParams(DEF[type]), ...params }, pn: SMP_PN[ref] || {}, extra: [] };

      const r = body.r; g.fillStyle = '#1f2c5c'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
      g.fillStyle = '#9fb1dd'; g.beginPath(); g.arc(0, 0, r, -0.95, 0.95); g.arc(0, 0, r * .82, 0.95, -0.95, true); g.fill();
      const cg = g.createRadialGradient(-r * .3, -r * .3, .2, 0, 0, r * .8); cg.addColorStop(0, '#e6e8eb'); cg.addColorStop(1, '#9ea4ab');
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, r * .78, 0, 7); g.fill();
      g.strokeStyle = '#7d838a'; g.lineWidth = .12; g.beginPath(); g.moveTo(-r * .45, 0); g.lineTo(r * .45, 0); g.moveTo(0, -r * .45); g.lineTo(0, r * .45); g.stroke();
    }
    g.restore();
  }
  g.restore();
  g.strokeStyle = 'rgba(210,225,190,.25)'; g.lineWidth = 1.5; rr(M, M, BW * ppm, BH * ppm, 2 * ppm); g.stroke();
  const vg = g.createRadialGradient(W * .45, H * .4, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.38)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const lg = g.createLinearGradient(0, 0, W, H); lg.addColorStop(0, 'rgba(255,248,230,.07)'); lg.addColorStop(.5, 'rgba(255,255,255,0)'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const src = cv.toDataURL('image/jpeg', .9);

  /* --- half-finished map --- */
  const d = newDoc(); d.name = 'Näidisplaat BB-01'; d.ppm = ppm; d.calibrated = true; d.sample = true;
  d.calib = { a: B(0, 0), b: B(BW, 0), mm: BW };
  doc = d;
  const ids = {};
  for (const s of specs) if (s.placed) { const c = addComp(s.c.type, s.c.x, s.c.y, { rot: s.c.rot, value: s.c.value, params: { ...s.c.params }, pn: { ...s.c.pn } }); c.ref = s.c.ref; ids[s.c.ref] = c.id; }
  for (const [net, a, via, b, w, demo] of SMP_TRACES) {
    if (!demo) continue;
    const ep = e => { const q = endXY(e); return typeof e[0] === 'string' && ids[e[0]] ? { c: ids[e[0]], p: e[1], x: f2(q[0]), y: f2(q[1]) } : { x: f2(q[0]), y: f2(q[1]) }; };
    d.traces.push({ id: uid('t'), a: ep(a), b: ep(b), pts: via.map(p => B(p[0], p[1]).map(f2)), w, layer: 'top', net });
  }
  d.dims.push({ id: uid('d'), a: { x: B(0, 0)[0], y: B(0, 0)[1] }, b: { x: B(BW, 0)[0], y: B(BW, 0)[1] }, off: -26 });
  d.dims.push({ id: uid('d'), a: { x: B(0, 0)[0], y: B(0, 0)[1] }, b: { x: B(0, BH)[0], y: B(0, BH)[1] }, off: 26 });
  d.outlines.push({ id: uid('o'), x: M, y: M, w: BW * ppm, h: BH * ppm, dims: false });
  touch();
  img = { src, w: W, h: H, name: 'naidisplaat-bb01.jpg' };
}

/* ================= wiring ================= */
function renderAll() { renderScene(); renderOverlay(); renderSide(); renderSteps(); renderOptbar(); renderStatus(); renderRail(); }

$('#steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) goStep(b.dataset.step); });
$('#rail').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); });
$('#tabs').addEventListener('click', e => {
  if (e.target.closest('#sideClose')) { closeSideNarrow(); return; }
  const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab);
});
$('#btnPanel').addEventListener('click', () => $('#app').classList.toggle('side-open'));
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#btnNew').addEventListener('click', newProject);
$('#btnOpen').addEventListener('click', () => $('#fileProj').click());
$('#btnSave').addEventListener('click', saveProject);
$('#btnExport').addEventListener('click', () => { S.step = 'export'; renderSteps(); openExport(); });
$('#btnHelp').addEventListener('click', openHelp);
$('#dzPick').addEventListener('click', () => $('#fileImg').click());
$('#fileImg').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadImageFile(f); });
$('#fileProj').addEventListener('change', e => { const f = e.target.files; if (f.length) handleFiles(f); e.target.value = ''; });
$('#projName').addEventListener('change', e => { doc.name = e.target.value.trim() || 'Plaat'; commit({ light: true }); });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* bottom strip */
$('#opRange').addEventListener('input', e => { ui.opacity = e.target.value / 100; if (!ui.layers.img) ui.layers.img = true; updateImageStyle(); queueSave(); });
$('#ctRange').addEventListener('input', e => { ui.contrast = e.target.value / 100; updateImageStyle(); queueSave(); });
$('#btnGray').addEventListener('click', () => { ui.gray = !ui.gray; updateImageStyle(); queueSave(); });
$('#btnRot').addEventListener('click', () => transformImage('rot'));
$('#btnFlip').addEventListener('click', () => transformImage('flip'));
$('#zIn').addEventListener('click', () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); });
$('#zOut').addEventListener('click', () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, .8); });
$('#zFit').addEventListener('click', fitView);
$('#scaleChip').addEventListener('click', () => goStep('scale'));
$('#btnLayers').addEventListener('click', e => {
  const p = $('#layersPop'), open = p.hidden; p.hidden = !open; e.currentTarget.setAttribute('aria-expanded', String(open));
  if (open) renderLayersPop();
});
document.addEventListener('pointerdown', e => { const p = $('#layersPop'); if (!p.hidden && !e.target.closest('#layersPop,#btnLayers')) { p.hidden = true; $('#btnLayers').setAttribute('aria-expanded', 'false'); } });
$('#layersPop').addEventListener('change', e => {
  const k = e.target.dataset.layer; if (!k) return;
  ui.layers[k] = e.target.checked; updateImageStyle(); schedule('scene'); queueSave();
});

/* options bar */
$('#optbar').addEventListener('click', e => {
  const b = e.target.closest('[data-opt]'); if (!b) return;
  const o = b.dataset.opt, v = b.dataset.v;
  if (o === 'layer') { S.traceLayer = v; if (S.draft && S.draft.kind === 'trace') S.draft.layer = v; renderOptbar(); schedule('over'); }
  else if (o === 'ptype') { S.pointType = v; renderOptbar(); schedule('over'); }
  else if (o === 'pickimg') $('#fileImg').click();
  else if (o === 'rot') transformImage('rot');
  else if (o === 'flip') transformImage('flip');
});
$('#optbar').addEventListener('change', e => {
  const id = e.target.id, v = parseNum(e.target.value);
  if (id === 'obW') { if (v > 0) { S.traceW = v; if (S.draft) S.draft.w = v; } renderOptbar(); }
  else if (id === 'obPin') { S.pinSize = v > 0 ? v : 0; renderOptbar(); schedule('over'); }
  else if (id === 'obPpm') { if (v > 0) { doc.ppm = v; doc.calibrated = true; commit(); toast(`Mõõtkava ${fmtN(v)} px/mm`); } else renderOptbar(); }
});
$('#optbar').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });

/* banner */
$('#banner').addEventListener('click', e => {
  const b = e.target.closest('[data-ban]'); if (!b) return;
  if (b.dataset.ban === 'close') { ui.bannerOff = true; renderBanner(); queueSave(); }
  else if (b.dataset.ban === 'photo') $('#fileImg').click();
  else if (b.dataset.ban === 'empty') newProject();
});

/* modal generic */
modal.addEventListener('click', e => {
  if (e.target.closest('[data-close]') || (e.target === modal && !modal.onclick)) { closeModal(); return; }
  const ex = e.target.closest('[data-ex]'); if (ex) runExport(ex.dataset.ex);
});
modal.addEventListener('change', e => {
  if (e.target.id === 'exPhoto') S.exPhoto = e.target.checked;
  if (e.target.id === 'exName') { doc.name = e.target.value.trim() || 'Plaat'; commit({ light: true }); }
});

/* sidebar */
tabBody.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) { const t = tile.dataset.type; if (S.tool === 'place' && S.placeType === t) setTool('select'); else { S.placeType = t; S.placeRot = 0; setTool('place'); S.placeType = t; renderOptbar(); renderSide(); } closeSideNarrow(); return; }
  const a = e.target.closest('[data-act]'); if (!a) {
    const segb = e.target.closest('[data-opt]');
    if (segb) {
      const o = anyById([...S.sel][0]); if (!o) return;
      if (segb.dataset.opt === 'side') o.side = segb.dataset.v;
      if (segb.dataset.opt === 'tlayer') o.layer = segb.dataset.v;
      commit();
    }
    return;
  }
  const act = a.dataset.act, cur = [...S.sel][0], c = compById(cur);
  const pinRow = a.closest('[data-pin]'), pid = pinRow ? pinRow.dataset.pin : null;
  switch (act) {
    case 'pick': {
      const id = a.dataset.id;
      if (S.sel.size === 1 && S.sel.has(id)) { S.sel.clear(); S.selPin = null; }
      else { selectOnly(id); centerOn(id); const n = kindOf(id) === 'trace' ? getNets().byTrace.get(id) : null; S.hlPinned = n ? n.key : null; }
      renderSide(); schedule('scene'); renderOptbar(); scrollRowIntoView(); break;
    }
    case 'addpin': setTool('pin'); toast(`Klõpsa ${c ? c.ref : 'komponendi'} peal kohta, kus jalg asub`); break;
    case 'selpin': if (c) { S.selPin = { c: c.id, p: pid }; const n = getNets().byPin.get(c.id + ':' + pid); S.hlPinned = n ? n.key : null; centerOnPin(c.id, pid); renderSide(); schedule('scene'); } break;
    case 'tracefrom': if (c) { closeSideNarrow(); startTraceFrom(c.id, pid); } break;
    case 'delpin': if (c) deletePin(c, pid); break;
    case 'hlnet': { const k = a.dataset.net; S.hlPinned = S.hlPinned === k ? null : k; schedule('scene'); renderSide(); break; }
    case 'dup': duplicateSelection(); break;
    case 'rot90': rotateSel(90); renderSide(); break;
    case 'del': deleteSelection(); break;
    case 'pingo': { const cid = a.dataset.c, p = a.dataset.p; selectOnly(cid); S.selPin = { c: cid, p }; centerOnPin(cid, p); setTab('board'); schedule('scene'); scrollRowIntoView(); break; }
  }
});
tabBody.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'libQ') { S.libQ = t.value; renderSide(); return; }
  if (t.id === 'boardQ') { S.boardQ = t.value; renderSide(); return; }
  const o = anyById([...S.sel][0]);
  if (t.dataset.f && o && kindOf(o.id) === 'comp') {
    const f = t.dataset.f;
    if (f === 'ref' || f === 'value' || f === 'note') { o[f] = t.value; schedule('scene'); }
    else { const v = parseNum(t.value); if (!Number.isFinite(v)) return; const [ox, oy] = origin(); if (f === 'x') o.x = f2(ox + v * doc.ppm); if (f === 'y') o.y = f2(oy + v * doc.ppm); if (f === 'rot') o.rot = v; touch(); schedule('scene'); }
  }
  if (t.dataset.pn != null && o) { o.pn = o.pn || {}; o.pn[t.dataset.pn] = t.value; touch(); schedule('scene'); }
});
tabBody.addEventListener('change', e => {
  const t = e.target, o = anyById([...S.sel][0]);
  if (t.id === 'netColors') { ui.netColors = t.checked; schedule('scene'); renderSide(); queueSave(); return; }
  if (t.dataset.netname) {
    const n = getNets().byKey.get(t.dataset.netname); if (!n) return;
    const name = t.value.trim();
    for (const id of n.traces) { const tr = doc.traces.find(x => x.id === id); if (tr) tr.net = name; }
    commit(); return;
  }
  if (!o) return;
  if (t.dataset.param) {
    const def = DEF[o.type], p = def.params.find(q => q.k === t.dataset.param);
    let v = t.value;
    if (p && p.n) { v = parseNum(v); if (!Number.isFinite(v)) { renderSide(); return; } v = clamp(v, p.n[0], p.n[1]); }
    o.params = { ...o.params, [t.dataset.param]: v };
    commit(); return;
  }
  if (t.dataset.f || t.dataset.pn != null) { commit({ light: true }); return; }
  if (t.dataset.tf) {
    if (t.dataset.tf === 'w') { const v = parseNum(t.value); if (v > 0) o.w = v; }
    if (t.dataset.tf === 'net') { const n = getNets().byTrace.get(o.id), name = t.value.trim(); (n ? n.traces : [o.id]).forEach(id => { const tr = doc.traces.find(x => x.id === id); if (tr) tr.net = name; }); }
    commit(); return;
  }
  if (t.dataset.of) {
    if (t.dataset.of === 'dims') o.dims = t.checked;
    else { const v = parseNum(t.value); if (v > 0) o[t.dataset.of] = f2(v * doc.ppm); }
    commit();
  }
});
tabBody.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });
tabBody.addEventListener('pointerover', e => { const n = e.target.closest('.net'); const k = n ? n.dataset.net : null; if (k !== S.hlNet) { S.hlNet = k; schedule('scene'); } });
tabBody.addEventListener('pointerleave', () => { if (S.hlNet) { S.hlNet = null; schedule('scene'); } });
tabBody.addEventListener('dragstart', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  e.dataTransfer.setData('text/x-pcb-part', t.dataset.type); e.dataTransfer.setData('text/plain', t.dataset.type); e.dataTransfer.effectAllowed = 'copy';
});
function centerOn(id) {
  const o = anyById(id); if (!o) return; let p;
  const k = kindOf(id);
  if (k === 'comp') p = [o.x, o.y]; else if (k === 'outline') p = [o.x + o.w / 2, o.y + o.h / 2];
  else if (k === 'trace') { const pts = tracePts(o); p = pts[Math.floor(pts.length / 2)]; } else p = epPos(o.a);
  panTo(p);
}
function centerOnPin(cid, pid) { const q = pinWorld(cid, pid); if (q) panTo(q); }
function panTo(p) {
  const r = svg.getBoundingClientRect(), sx = p[0] * view.z + view.x, sy = p[1] * view.z + view.y;
  if (sx > 60 && sx < r.width - 40 && sy > 40 && sy < r.height - 40) return;
  view.x = r.width / 2 - p[0] * view.z; view.y = r.height / 2 - p[1] * view.z; applyView(); schedule('scene');
}

/* drag & drop + paste */
let dragDepth = 0;
const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (isFileDrag(e)) { dragDepth++; const d = $('#drop'); d.hidden = false; d.classList.add('hot', 'overlay'); } });
window.addEventListener('dragleave', e => { if (isFileDrag(e) && --dragDepth <= 0) { dragDepth = 0; const d = $('#drop'); d.classList.remove('hot', 'overlay'); d.hidden = !!img; } });
window.addEventListener('dragover', e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = isFileDrag(e) ? 'copy' : 'copy'; });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0;
  const d = $('#drop'); d.classList.remove('hot', 'overlay'); d.hidden = !!img;
  const type = e.dataTransfer.getData('text/x-pcb-part');
  if (type && DEF[type] && wrap.contains(e.target)) {
    const w = toWorld(e), c = addComp(type, w[0], w[1]);
    selectOnly(c.id); S.tab = 'board'; commit(); scrollRowIntoView();
    toast(`${c.ref} paigutatud — ${DEF[type].name}`); return;
  }
  if (e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  if (typing(document.activeElement)) return;
  const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); loadImageFile(f); }
});
window.addEventListener('resize', () => schedule('scene'));

/* ================= boot ================= */
async function boot() {
  let restored = false;
  try {
    const a = await IDB.get('auto');
    if (a && a.doc && (a.doc.comps.length || a.doc.traces.length || !a.doc.sample)) {
      const im = await IDB.get('img');
      doc = { ...newDoc(), ...a.doc }; img = im || null;
      if (a.ui) { Object.assign(ui, a.ui); ui.layers = { ...DEFAULT_LAYERS, ...(a.ui.layers || {}) }; }
      restored = true;
      if (a.view && a.view.z) Object.assign(view, a.view);
    }
  } catch (e) { }
  if (!restored) { buildSample(); saveImage(); }
  touch(); resetHistory(); renderImage(); renderAll(); renderBanner();
  if (!restored || !view.z || view.z === 1) fitView(); else { applyView(); renderScene(); }
  if (restored) S.step = img ? 'place' : 'photo';
  renderSteps(); renderOptbar();
}
boot();

})();
</script>
